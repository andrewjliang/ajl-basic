title: ajl-basic
author: Andrew Liang
version: 1.0.1
quarto-required: ">=1.9.0"
contributes:
  formats:
    pdf:
      toc: false
      include-in-header: header.tex
      journal:
        blinded: false
      date-format: MMMM D, YYYY
      documentclass: article
      classoption:
        - 12pt
      template-partials:
        # Add here the partials your format is using
        - "partials/title.tex"
        - "partials/before-body.tex"

